# ============================================================================
# Agent Console 同域路由模板(外置 Nginx)
#
# 用途:与 dev-toolbox 既有外置 Nginx 部署合并;本文件是 agent-console 侧模板,
#       不是生效配置。与 dev-toolbox/deploy/nginx/external-nginx.conf.template
#       的 agent-console 段保持同构(那边把鉴权委托给内层 gateway;本模板是
#       "边缘自持全部路由"的等价形态,仅在边缘可达 relay 与 dev-toolbox api
#       内部网络时使用)。
#
# 占位符(使用前替换):
#   __DEVTOOLBOX_INTERNAL_BASE_URL__  dev-toolbox 内部服务地址(如 api:8080,内网)
#   __AGENT_CONSOLE_INTERNAL_TOKEN__  与 dev-toolbox 共享的内部服务 Token(secret 注入)
#   __AGENT_CONSOLE_RELAY__           relay 服务地址(默认 agent-console-relay:8081,
#                                     由 agent-console compose 生产 overlay 以网络
#                                     别名加入 dev-toolbox_frontend 网络)
#   __SERVER_NAME__                   对外域名
#
# 契约要点(规格第 20/22 节,与 caddy.snippet.example 一致):
#   - 网关覆盖并删除客户端伪造的内部身份 header,verify 通过后再注入
#     X-Agent-Console-Session-Id / X-Agent-Console-Owner-Id。
#   - verify 为 GET /internal/agent-console/auth-sessions/verify(Bearer 内部 Token),
#     浏览器原始 Cookie/Origin/CSRF 随鉴权子请求递交;非读方法按写请求
#     fail-closed 校验。
#   - Cookie 不转发给 relay;relay 响应不得设置或修改 dev-toolbox Cookie。
#   - Bridge 数据面(/agent-console/bridge/*、/agent-console/transfers/*)无浏览器
#     会话:不做 auth_request,Authorization Bearer(设备凭据/transfer token)
#     必须原样转发给 relay 校验。
#   - WS ticket 在 Sec-WebSocket-Protocol 中,必须原样转发给 relay 原子消费,
#     网关不得记录该 header。
# ============================================================================

# WebSocket 升级用 Connection 头映射(=/agent-console/ws 与 /agent-console/bridge/ws 共用)
map $http_upgrade $agent_console_connection_upgrade {
    default upgrade;
    ''      close;
}

upstream agent_console_relay {
    server __AGENT_CONSOLE_RELAY__;
    keepalive 32;
}

server {
    listen 443 ssl;
    http2  on;
    server_name __SERVER_NAME__;

    # TLS 证书由 dev-toolbox 侧统一管理,此处省略证书配置。

    # forward_auth 子请求:dev-toolbox 无 touch 会话验证(GET + header 输入)。
    # internal:只能被本 server 内 auth_request 调用,不对外暴露。
    location = /_agent_console_auth_verify {
        internal;
        proxy_pass              http://__DEVTOOLBOX_INTERNAL_BASE_URL__/internal/agent-console/auth-sessions/verify;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length "";
        proxy_set_header        Authorization    "Bearer __AGENT_CONSOLE_INTERNAL_TOKEN__";
        proxy_set_header        Cookie           $http_cookie;
        proxy_set_header        Origin           $http_origin;
        proxy_set_header        X-CSRF-Token     $http_x_csrf_token;
        proxy_set_header        X-Agent-Console-Method  $request_method;
    }

    # ---------- REST API:/agent-console/api/* ----------
    location /agent-console/api/ {
        # 1) 覆盖并删除客户端伪造的内部身份 header
        proxy_set_header X-Agent-Console-Session-Id "";
        proxy_set_header X-Agent-Console-Owner-Id   "";
        # 2) 鉴权子请求(401 时 nginx 直接返回,不触达 relay)
        auth_request /_agent_console_auth_verify;
        auth_request_set $ac_auth_session $upstream_http_x_agent_console_session_id;
        auth_request_set $ac_auth_owner   $upstream_http_x_agent_console_owner_id;
        # 3) 转发 relay:不带 Cookie,重设内部身份 header
        proxy_pass http://agent_console_relay;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Cookie "";
        proxy_set_header X-Agent-Console-Session-Id $ac_auth_session;
        proxy_set_header X-Agent-Console-Owner-Id   $ac_auth_owner;
    }

    # ---------- WebSocket:/agent-console/ws ----------
    location = /agent-console/ws {
        proxy_pass http://agent_console_relay;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $agent_console_connection_upgrade;
        # ticket 位于 Sec-WebSocket-Protocol 子协议,原样转发,由 relay 消费;
        # 网关不得剥离该 header,也不得记录其内容。Cookie 不转发给 relay。
        proxy_set_header Cookie "";
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # ---------- Bridge 数据面:/agent-console/bridge/* ----------
    # bridge/ws 为 WSS(Authorization Bearer 设备凭据);pairing/register、
    # pairing/claim 为普通 POST(短码即凭证,限速由 relay 按来源执行)。
    # 无浏览器会话,不做 auth_request;Authorization 必须原样透传;
    # 升级头对普通 POST 无副作用;配对入口加 4KiB 保守请求体上限。
    location /agent-console/bridge/ {
        proxy_pass http://agent_console_relay;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $agent_console_connection_upgrade;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    location = /agent-console/bridge/pairing/register {
        proxy_pass http://agent_console_relay;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        client_max_body_size 4k;
    }

    location = /agent-console/bridge/pairing/claim {
        proxy_pass http://agent_console_relay;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        client_max_body_size 4k;
    }

    # ---------- 文件数据面:/agent-console/transfers/* ----------
    location /agent-console/transfers/ {
        # Bridge 主动出站调用,device credential + transfer token 鉴权,
        # 无浏览器 Cookie,不做 auth_request;网关不落盘、不缓冲。
        proxy_pass http://agent_console_relay;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering         off;
        # 单文件上传初始上限 20 MiB(规格 22.5),留少量协议开销余量
        client_max_body_size    25m;
    }

    # 其余路径由 dev-toolbox 既有站点配置接管,本模板不定义 root/location /。
}
