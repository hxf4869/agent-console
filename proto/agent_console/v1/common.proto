// Agent Console 通用领域类型。
//
// 权威规格:docs/ZCODE-BACKEND-EXECUTION-SPEC.md
//   §9(领域标识)、§10(多维状态模型)、§17(Protobuf 与 WebSocket 合同)、
//   §22.3(预览与下载限制)、§27.6(必需稳定错误码)。
//
// 字段号冻结约定(§17.1):字段号一旦发布即视为冻结,不得复用;删除字段必须 reserved。
// 同一 package 内所有枚举值共享命名空间,因此除 StableErrorCode(按任务要求使用
// 全大写同名值)外,其余枚举值都带类型前缀以避免跨枚举冲突。
//
// 隐私边界(§17.2 / §25):本文件任何消息不得携带 Cookie、设备明文凭据、文件正文
// 或本机绝对路径。

syntax = "proto3";

package agent_console.v1;

import "google/protobuf/timestamp.proto";

// ---------------------------------------------------------------------------
// Agent / Client 标识
// ---------------------------------------------------------------------------

// Agent 种类(§9.1)。枚举值只追加,不得改动或复用既有数值(§17.1);
// 同一 package 内枚举值共享命名空间,故统一带 AGENT_KIND_ 前缀。
enum AgentKind {
  AGENT_KIND_UNSPECIFIED = 0;
  CODEX_DESKTOP = 1;
  // ZCode Desktop(官方 Hook / MCP 通路;ZC-02)。接收方必须容忍未知枚举值。
  ZCODE_DESKTOP = 2;
}

// WebSocket 两端角色(§17.2 Hello 握手)。
enum ClientKind {
  CLIENT_KIND_UNSPECIFIED = 0;
  CLIENT_BROWSER = 1;
  CLIENT_BRIDGE = 2;
}

// ---------------------------------------------------------------------------
// §10 多维状态模型(禁止单一 session_status)
// ---------------------------------------------------------------------------

// §10.1 设备连接状态。无法区分关机/休眠/断网时统一为 OFFLINE,不猜测原因。
// 注意:proto 枚举值在同一 package 内共享命名空间,StableErrorCode 按任务要求
// 保留裸值 DEVICE_OFFLINE,故本枚举值使用 CONNECTION_ 前缀。
enum DeviceConnection {
  DEVICE_CONNECTION_UNSPECIFIED = 0;
  CONNECTION_CONNECTING = 1;
  CONNECTION_ONLINE = 2;
  CONNECTION_DEGRADED = 3;
  CONNECTION_OFFLINE = 4;
}

// §10.2 控制模式,由 Adapter capability probe 决定,不由前端自行推断。
enum ControlMode {
  CONTROL_MODE_UNSPECIFIED = 0;
  CONTROL_MODE_FULL_CONTROL = 1;
  CONTROL_MODE_LIMITED_CONTROL = 2;
  CONTROL_MODE_READ_ONLY = 3;
  CONTROL_MODE_UNAVAILABLE = 4;
}

// §10.3 兼容状态。未知版本默认 DEGRADED + READ_ONLY。
enum CompatibilityState {
  COMPATIBILITY_STATE_UNSPECIFIED = 0;
  COMPATIBILITY_VERIFIED = 1;
  COMPATIBILITY_DEGRADED = 2;
  COMPATIBILITY_UNSUPPORTED = 3;
}

// §10.4 当前 turn 阶段。等待用户/审批不作为互斥 phase,放入 PendingAttention。
enum ActiveTurnPhase {
  ACTIVE_TURN_PHASE_UNSPECIFIED = 0;
  TURN_PHASE_IDLE = 1;
  TURN_PHASE_RUNNING = 2;
  TURN_PHASE_FINISHING = 3;
}

// §10.5 待处理关注类型。
enum PendingAttentionKind {
  PENDING_ATTENTION_KIND_UNSPECIFIED = 0;
  ATTENTION_USER_QUESTION = 1;
  ATTENTION_RISK_APPROVAL = 2;
}

// §10.6 单条下一轮队列状态。
enum QueueState {
  QUEUE_STATE_UNSPECIFIED = 0;
  QUEUE_STATE_EMPTY = 1;
  QUEUE_STATE_QUEUED = 2;
  QUEUE_STATE_PAUSED = 3;
}

// §10.7 上一轮结果。只描述上一轮,不把任务永久标成失败。
enum LastTurnOutcome {
  LAST_TURN_OUTCOME_UNSPECIFIED = 0;
  TURN_OUTCOME_COMPLETED = 1;
  TURN_OUTCOME_FAILED = 2;
  TURN_OUTCOME_INTERRUPTED = 3;
  TURN_OUTCOME_UNKNOWN = 4;
}

// §10.8 后台命令状态。主 turn 完成后允许仍显示后台命令,不得发明
// "所有 Agent 完成"之类的综合状态。
enum BackgroundCommandState {
  BACKGROUND_COMMAND_STATE_UNSPECIFIED = 0;
  BACKGROUND_CMD_RUNNING = 1;
  BACKGROUND_CMD_COMPLETED = 2;
  BACKGROUND_CMD_FAILED = 3;
  BACKGROUND_CMD_STOPPED = 4;
  BACKGROUND_CMD_UNKNOWN = 5;
}

// §13.2 输出通道。原生无法区分 stdout/stderr 时只能使用 COMBINED,不得猜测。
enum OutputChannel {
  OUTPUT_CHANNEL_UNSPECIFIED = 0;
  OUTPUT_CHANNEL_STDOUT = 1;
  OUTPUT_CHANNEL_STDERR = 2;
  OUTPUT_CHANNEL_COMBINED = 3;
}

// ---------------------------------------------------------------------------
// §27.6 必需稳定错误码
// ---------------------------------------------------------------------------

// 与 HTTP JSON 错误的 `code` 使用同一稳定 code 集合(§27.5),前端不得依赖
// 自由文本判断流程。枚举值使用与规格完全一致的全大写名称。
// 数值一旦发布即冻结;新增错误码只能追加,不得改动或复用已有数值。
enum StableErrorCode {
  STABLE_ERROR_CODE_UNSPECIFIED = 0;
  AUTH_REQUIRED = 1;
  AUTH_EXPIRED = 2;
  CSRF_INVALID = 3;
  WS_TICKET_INVALID = 4;
  WS_TICKET_EXPIRED = 5;
  WS_TICKET_CONSUMED = 6;
  DEVICE_OFFLINE = 7;
  DEVICE_REVOKED = 8;
  CODEX_UNAVAILABLE = 9;
  CODEX_VERSION_UNVERIFIED = 10;
  CONTROL_READ_ONLY = 11;
  CAPABILITY_UNSUPPORTED = 12;
  SESSION_NOT_FOUND = 13;
  STALE_TURN = 14;
  DUPLICATE_REQUEST_MISMATCH = 15;
  OUTCOME_UNKNOWN = 16;
  RESYNC_REQUIRED = 17;
  QUEUE_ALREADY_EXISTS = 18;
  QUEUE_PAUSED = 19;
  QUESTION_EXPIRED = 20;
  APPROVAL_EXPIRED = 21;
  SETTING_COMBINATION_UNSUPPORTED = 22;
  FILE_HANDLE_INVALID = 23;
  FILE_OUTSIDE_SCOPE = 24;
  FILE_CHANGED = 25;
  FILE_TYPE_NOT_PREVIEWABLE = 26;
  TRANSFER_EXPIRED = 27;
  TRANSFER_TOO_LARGE = 28;
  TRANSFER_RANGE_INVALID = 29;
  DIFF_TOO_LARGE = 30;
  RATE_LIMITED = 31;
  INTERNAL_ERROR = 32;
}

// ---------------------------------------------------------------------------
// §9 领域标识
// ---------------------------------------------------------------------------

// 复合原生会话键(§9.1)。任何会话都以此为准。
message SessionKey {
  // 设备 ID。
  string device_id = 1;
  // 首版只有 CODEX_DESKTOP。
  AgentKind agent_kind = 2;
  // Codex 原生 session/thread ID。
  string native_session_id = 3;
  // Relay 内部 UUID,仅用于 URL 与日志关联;不得覆盖原生键,也不是订阅寻址的
  // 必需字段。可为空。
  string relay_session_uuid = 4;
}

// 稳定 turn ID 包装(§9.2)。turn_id 使用 Codex 原生 ID;无法取得时由 Adapter
// 生成 scoped 稳定 ID 并置 synthetic=true。禁止用消息数组下标充当稳定 ID。
message TurnId {
  string id = 1;
  bool synthetic = 2;
}

// 稳定 item ID 包装(§9.2),语义同 TurnId。
message ItemId {
  string id = 1;
  bool synthetic = 2;
}

// ---------------------------------------------------------------------------
// Provider 扩展(§17.3)
// ---------------------------------------------------------------------------

// Provider 扩展槽。首版只允许 Codex Adapter 写入;消费方遇到无法识别的
// critical 扩展时不得执行(忽略或要求升级),不得把它当作通用数据通道。
message ProviderExtension {
  // 类型 URL,如 `type.googleapis.com/agent_console.codex.v1.SomeExtension`。
  string type_url = 1;
  // 扩展自身版本。
  string version = 2;
  // 序列化字节。内容对 Relay 不透明。
  bytes payload = 3;
}

// ---------------------------------------------------------------------------
// 设备 presence(§10.1;Envelope payload 与领域事件共用)
// ---------------------------------------------------------------------------

message DevicePresence {
  string device_id = 1;
  DeviceConnection connection = 2;
  google.protobuf.Timestamp last_seen_at = 3;
  // DEGRADED 时的原因;OFFLINE 时不猜测原因,必须为空。
  string degraded_reason = 4;
}

// ---------------------------------------------------------------------------
// 文件/传输限制(§22.3 集中定义并在能力响应中暴露,不得散落在 handler)
// ---------------------------------------------------------------------------

// 首版默认限制,由 Bridge 在 CapabilitySnapshot 中如实上报;数值调整必须以
// 真实样本重新确认,不得静默放宽。
message TransferLimits {
  // UTF-8/可识别文本、源码、Markdown、JSON、日志内联预览上限。默认 2 MiB。
  uint64 text_inline_max_bytes = 1;
  // PNG/JPEG/WebP/GIF 内联预览上限。默认 25 MiB。
  uint64 image_inline_max_bytes = 2;
  // PDF(单 Range)预览的文件大小上限。默认 100 MiB。
  uint64 pdf_range_max_bytes = 3;
  // 普通下载上限。默认 512 MiB;超过返回 TRANSFER_TOO_LARGE。
  uint64 download_max_bytes = 4;
  // 单文件上传上限。默认 20 MiB(§22.5)。
  uint64 upload_max_bytes = 5;
  // 每 Browser 并发 transfer 上限。默认 2(§22.6)。
  uint32 max_concurrent_per_browser = 6;
  // 每 device 并发 transfer 上限。默认 2(§22.6)。
  uint32 max_concurrent_per_device = 7;
  // 可直接预览的 MIME 类型/前缀允许列表(如 "text/", "application/json")。
  // HTML 与 SVG 默认按源码文本返回,不得作为活动页面执行。
  repeated string previewable_mime_prefixes = 8;
}

// ---------------------------------------------------------------------------
// 协议级帧大小约定(§17.6 / §13.2)
//
// 结构化 Protobuf 单帧默认不得超过 1 MiB(编解码助手强制);
// 输出分块默认不超过 64 KiB;文件正文禁止进入 Protobuf。
// 这些是协议常数,以编解码助手常量而非消息字段表达。
// ---------------------------------------------------------------------------
